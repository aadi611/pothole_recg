[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadwatch"
version = "0.1.0"
description = "Real-time pothole detection and civic reporting for Indian roads"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core contracts and config
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    "structlog>=24.4,<26",
    "ulid-py>=1.1,<2",

    # Vision runtime (the model library itself is an optional extra - see below)
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",

    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.12,<1",
    "websockets>=13,<15",

    # Persistence
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "geoalchemy2>=0.15,<1",

    # Auth
    "pyjwt>=2.9,<3",
    "argon2-cffi>=23.1,<25",

    # Outbound
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# The model library lives behind an extra so the API container never installs
# torch. Enforced by the boundary check in scripts/check_boundaries.py
# (FR-DET-01): nothing outside roadwatch/detection/ may import ultralytics
# or torch.
detection = [
    "ultralytics>=8.3,<9",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]

training = [
    "roadwatch[detection]",
    "albumentations>=1.4.21,<2",
]

edge = [
    "pyttsx3>=2.98,<3",
    "pynmea2>=1.19,<2",
    "pyserial>=3.5,<4",
]

dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-pyyaml",
    "httpx>=0.27,<1",
]

[project.scripts]
roadwatch-edge = "roadwatch.edge_app:main"

[tool.hatch.build.targets.wheel]
packages = ["roadwatch"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
    # `str, Enum` is the pattern specified in spec/03_DATA_CONTRACTS.md. It is
    # deliberate: these enums serialise to plain JSON strings across the API
    # boundary and compare equal to their string values, which StrEnum only
    # gained in 3.11 and which the spec's contracts rely on throughout.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# `import albumentations as A` is that library's universal convention; every
# example in its docs uses it, and renaming would make the pipeline harder to
# compare against upstream references.
"roadwatch/training/augment.py" = ["N812"]
# Kalman filter matrices use the conventional single-capital symbols from the
# literature (F, H, P, Q, R, S, K). Lowercasing them would make the
# implementation harder to check against any standard reference.
"roadwatch/tracking/tracker.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Third-party libraries without bundled stubs.
[[tool.mypy.overrides]]
module = ["cv2.*", "ultralytics.*", "albumentations.*", "geoalchemy2.*", "ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that take more than a second",
    "gpu: tests requiring CUDA",
    "fixture_video: tests requiring tests/fixtures/drive.mp4",
]
